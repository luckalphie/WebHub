name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show developer tools
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-path
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            sh -n "$script"
          done
      - name: Build
        run: sh scripts/build.sh -c release
      - name: Package app bundle
        run: sh scripts/build-app.sh
      - name: Verify bundle layout
        run: |
          test -x dist/WebHub.app/Contents/MacOS/WebHub
          test -f dist/WebHub.app/Contents/Resources/launcher.html
          test -f dist/WebHub.app/Contents/Resources/WebHub.icns
          test -x dist/WebHub.app/Contents/Resources/WebHubRunner.app/Contents/MacOS/WebHubRunner
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" dist/WebHub.app/Contents/Info.plist
      - name: Verify deployment target and SDK version
        run: |
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          min_version="$(swift package dump-package | plutil -extract platforms.0.version raw -o - -)"
          for binary in dist/WebHub.app/Contents/MacOS/WebHub dist/WebHub.app/Contents/Resources/WebHubRunner.app/Contents/MacOS/WebHubRunner; do
            build_info="$(xcrun vtool -show-build "$binary")"
            printf '%s\n' "$build_info"
            test "$(printf '%s\n' "$build_info" | awk '$1 == "minos" {print $2}')" = "$min_version"
            test "$(printf '%s\n' "$build_info" | awk '$1 == "sdk" {print $2}')" = "$sdk_version"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: WebHub-app
          path: dist/WebHub.app
          if-no-files-found: error
