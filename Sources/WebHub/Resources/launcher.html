<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebHub</title>
<style>
  :root {
    --tile: 80px;
    --gap: 34px;
    --label: rgba(255,255,255,.92);
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif;
    background: #0d1016;
    color: #fff;
  }
  /* 壁纸 */
  .wallpaper {
    position: fixed; inset: 0;
    background:
      radial-gradient(1100px 700px at 12% 6%, rgba(96,165,250,.42), transparent 62%),
      radial-gradient(900px 640px at 88% 4%, rgba(232,121,249,.30), transparent 60%),
      radial-gradient(1000px 780px at 72% 96%, rgba(251,146,60,.30), transparent 62%),
      radial-gradient(820px 600px at 20% 92%, rgba(16,185,129,.24), transparent 62%),
      linear-gradient(160deg, #101627 0%, #131a2c 42%, #0c1220 100%);
    filter: saturate(1.05);
  }
  .wallpaper::after {
    content: ""; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.055) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity: .5;
  }

  .stage { position: relative; height: 100%; display: flex; flex-direction: column; }

  /* 顶部栏：窗口拖动由系统标题栏负责，WKWebView 不支持 -webkit-app-region */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 34px 6px; flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 12px; }
  .brand h1 {
    margin: 0; font-size: 21px; font-weight: 600; letter-spacing: .2px;
    text-shadow: 0 1px 12px rgba(0,0,0,.35);
  }
  .brand span { font-size: 12.5px; color: rgba(255,255,255,.52); letter-spacing: .3px; }
  .hint { font-size: 12px; color: rgba(255,255,255,.42); }

  /* 网格 */
  .gridwrap {
    flex: 1 1 auto; overflow-y: auto; overflow-x: hidden;
    padding: 26px 40px 60px;
  }
  .gridwrap::-webkit-scrollbar { width: 10px; }
  .gridwrap::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.16); border-radius: 8px; border: 3px solid transparent;
    background-clip: content-box;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--tile), var(--tile)));
    gap: var(--gap);
    justify-content: start;
    align-content: start;
  }

  /* 图标单元 */
  .app {
    width: var(--tile); display: flex; flex-direction: column; align-items: center;
    gap: 8px; cursor: default; position: relative;
    transition: transform .16s cubic-bezier(.3,.9,.3,1);
  }
  .app:hover { transform: translateY(-2px); }
  .app:active { transform: scale(.94); }
  .app.dragging { opacity: .38; }
  .app.drop-target::before {
    content: ""; position: absolute; inset: -10px -8px -6px;
    border-radius: 22px; border: 1.5px dashed rgba(255,255,255,.5);
  }

  .icon {
    width: var(--tile); height: var(--tile);
    border-radius: 19px; overflow: hidden; position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.34), 0 1px 0 rgba(255,255,255,.14) inset;
    background: #232a3a;
  }
  .icon img { width: 58%; height: 58%; object-fit: contain; display: block; }
  .icon .letter {
    font-size: 31px; font-weight: 600; color: rgba(255,255,255,.96);
  }
  .icon .icon-name {
    max-width: 82%; overflow: hidden; text-align: center;
    font-size: 18px; line-height: 1.15; font-weight: 600;
  }
  .icon .icon-name.white-text { text-shadow: 0 1px 3px rgba(0,0,0,.62); }
  .icon-name-line { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon .badge {
    position: absolute; right: -5px; top: -5px;
    width: 13px; height: 13px; border-radius: 50%;
    background: #34d399; border: 2.5px solid #131a2c;
    opacity: 0; transition: opacity .2s;
  }
  .app.running .badge { opacity: 1; }

  .name {
    font-size: 11.5px; line-height: 1.25; color: var(--label);
    text-align: center; max-width: calc(var(--tile) + 12px);
    text-shadow: 0 1px 6px rgba(0,0,0,.55);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* 新增按钮 */
  .app.add .icon {
    background: rgba(255,255,255,.09);
    border: 1.6px dashed rgba(255,255,255,.34);
    box-shadow: none;
    backdrop-filter: blur(6px);
  }
  .app.add .icon span { font-size: 28px; font-weight: 300; color: rgba(255,255,255,.78); }
  .app.add:hover .icon { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.5); }

  /* 空状态 */
  .empty {
    margin: 60px 0 0; color: rgba(255,255,255,.5); font-size: 13.5px; line-height: 2;
  }

  /* 右键菜单 */
  .menu {
    position: fixed; z-index: 40; min-width: 168px; padding: 6px;
    border-radius: 12px; background: rgba(38,44,58,.86);
    backdrop-filter: blur(22px) saturate(1.4);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    display: none;
  }
  .menu.show { display: block; animation: pop .13s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  .menu button {
    display: flex; width: 100%; align-items: center; gap: 9px;
    padding: 8px 10px; border: 0; border-radius: 8px; background: transparent;
    color: #eef2f8; font-size: 13px; text-align: left; cursor: default;
    font-family: inherit;
  }
  .menu button:hover { background: rgba(255,255,255,.11); }
  .menu button.danger { color: #ff8087; }
  .menu .sep { height: 1px; margin: 5px 6px; background: rgba(255,255,255,.11); }

  /* 编辑弹窗 */
  .sheet-mask {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center;
    background: rgba(6,9,16,.52); backdrop-filter: blur(8px);
  }
  .sheet-mask.show { display: flex; }
  .sheet {
    width: 396px; padding: 24px; border-radius: 18px;
    background: rgba(34,40,54,.94);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
    animation: pop .16s ease-out;
  }
  .sheet h2 { margin: 0 0 18px; font-size: 15.5px; font-weight: 600; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11.5px; color: rgba(255,255,255,.55); margin-bottom: 6px; letter-spacing: .2px; }
  .field input {
    width: 100%; padding: 9px 11px; border-radius: 9px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07); color: #fff;
    font-size: 13px; font-family: inherit; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  .field input:focus { border-color: rgba(96,165,250,.85); background: rgba(255,255,255,.1); }
  .field.icon-url-field { display: none; }
  .field.icon-url-field.visible { display: block; }
  .field .tip { font-size: 11px; color: rgba(255,255,255,.38); margin-top: 5px; }
  .login-setting-row { display: flex; align-items: center; justify-content: space-between; }
  .login-setting-title { font-size: 11.5px; color: rgba(255,255,255,.55); letter-spacing: .2px; }
  .login-toggle { display: inline-flex !important; align-items: center; gap: 8px; margin: 0 !important; color: #eef2f8 !important; font-size: 12px !important; cursor: default; }
  .login-toggle input { position: absolute; width: 1px; height: 1px; padding: 0; opacity: 0; pointer-events: none; }
  .login-switch { width: 30px; height: 18px; border-radius: 10px; background: rgba(255,255,255,.22); position: relative; transition: background .16s; }
  .login-switch::after { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: transform .16s; }
  .login-toggle input:checked + .login-switch { background: #3b82f6; }
  .login-toggle input:checked + .login-switch::after { transform: translateX(12px); }
  .login-toggle input:focus-visible + .login-switch { outline: 2px solid rgba(96,165,250,.8); outline-offset: 2px; }

  .swatches { display: flex; gap: 9px; }
  .swatch {
    width: 24px; height: 24px; border-radius: 50%; cursor: default;
    border: 2px solid transparent; transition: transform .12s;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.22); }
  .icon-modes { display: flex; gap: 8px; }
  .icon-modes button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); color: #eef2f8; font: inherit; font-size: 12px; }
  .icon-modes button.active { border-color: #60a5fa; background: rgba(59,130,246,.24); }

  .sheet-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 20px; }
  .btn {
    padding: 8px 17px; border-radius: 9px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.08); color: #eef2f8;
    font-size: 13px; cursor: default; font-family: inherit;
  }
  .btn:hover { background: rgba(255,255,255,.15); }
  .btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; font-weight: 500; }
  .btn.primary:hover { background: #4a8dfa; }
  .btn:disabled { opacity: .45; }
</style>
</head>
<body>
<div class="wallpaper"></div>
<div class="stage">
  <header>
    <div class="brand">
      <h1>WebHub</h1>
      <span id="count"></span>
    </div>
    <div class="hint">点图标打开 · 右键管理 · 拖拽排序</div>
  </header>
  <div class="gridwrap">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">
      还没有应用。<br>点右下角「+」或右键空白处添加你的第一个网站。
    </div>
  </div>
</div>

<div class="menu" id="menu">
  <button data-act="open">打开</button>
  <button data-act="edit">编辑…</button>
  <button data-act="reicon">刷新图标</button>
  <div class="sep"></div>
  <button data-act="clearlogin">清除该站点登录状态</button>
  <button data-act="delete" class="danger">从桌面移除</button>
</div>

<div class="sheet-mask" id="mask">
  <div class="sheet">
    <h2 id="sheetTitle">添加应用</h2>
    <div class="field">
      <label>名称</label>
      <input id="fName" placeholder="例如 Bing" spellcheck="false">
    </div>
    <div class="field">
      <label>网址</label>
      <input id="fURL" placeholder="https://example.com" spellcheck="false">
      <div class="tip">不写协议会自动补 https://</div>
    </div>
    <div class="field">
      <label>支持的域名</label>
      <input id="fSupportedDomains" placeholder="example.com, docs.example.net" spellcheck="false">
      <div class="tip">逗号分隔；域名及其子域名留在 WebHub，其他链接用默认浏览器打开。</div>
    </div>
    <div class="field">
      <div class="login-setting-row">
        <span class="login-setting-title">登录状态</span>
        <label class="login-toggle"><input id="fIsolatedLogin" type="checkbox"><span class="login-switch"></span><span>独立保存</span></label>
      </div>
      <div class="tip">关闭时与其他 WebApp 共享；开启后需在此应用重新登录。</div>
    </div>
    <div class="field">
      <label>主题色</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="field">
      <label>图标来源</label>
      <div class="icon-modes" id="iconModes">
        <button type="button" data-mode="website">网页图标</button>
        <button type="button" data-mode="name">应用名称</button>
      </div>
    </div>
    <div class="field icon-url-field" id="iconURLField">
      <label>自定义图标 URL</label>
      <input id="fIconURL" placeholder="https://example.com/icon.png" spellcheck="false">
      <div class="tip">留空时自动获取网页图标</div>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="btnCancel">取消</button>
      <button class="btn primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<script>
const bridge = window.webkit && window.webkit.messageHandlers ? window.webkit.messageHandlers.hub : null;
function post(type, payload) {
  if (bridge) bridge.postMessage(Object.assign({ type }, payload || {}));
}

const ACCENTS = ["#FFFFFF","#F06030","#3B82F6","#8B5CF6","#10B981","#F59E0B","#EC4899","#06B6D4","#6366F1"];
let state = { apps: [], running: [] };
let editingId = null;
let chosenAccent = ACCENTS[0];
let chosenIconMode = 'website';
let menuTargetId = null;

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const menu = document.getElementById('menu');
const mask = document.getElementById('mask');

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function iconNameLines(name) {
  const text = (name || 'Web').trim().replace(/\s+/g, ' ') || 'Web';
  const words = text.split(' ');
  if (words.length > 1) {
    let best = 1;
    let difference = Infinity;
    for (let i = 1; i < words.length; i++) {
      const first = words.slice(0, i).join(' ');
      const second = words.slice(i).join(' ');
      const current = Math.abs(Array.from(first).length - Array.from(second).length);
      if (current < difference) { best = i; difference = current; }
    }
    return [words.slice(0, best).join(' '), words.slice(best).join(' ')];
  }
  const characters = Array.from(text);
  if (characters.length > 3 && /[\u3400-\u9fff]/u.test(text)) {
    const middle = Math.ceil(characters.length / 2);
    return [characters.slice(0, middle).join(''), characters.slice(middle).join('')];
  }
  return [text];
}

function render() {
  const apps = state.apps || [];
  document.getElementById('count').textContent = apps.length ? apps.length + ' 个应用' : '';
  empty.style.display = apps.length ? 'none' : 'block';

  grid.innerHTML = '';
  for (const app of apps) {
    grid.appendChild(tile(app));
  }
  const add = document.createElement('div');
  add.className = 'app add';
  add.innerHTML = '<div class="icon"><span>+</span></div><div class="name">添加</div>';
  add.addEventListener('click', () => openSheet(null));
  grid.appendChild(add);
}

function tile(app) {
  const el = document.createElement('div');
  el.className = 'app' + (state.running.includes(app.id) ? ' running' : '');
  el.dataset.id = app.id;
  el.draggable = true;

  const nameLines = iconNameLines(app.name);
  const longestLine = Math.max(...nameLines.map(line => Array.from(line).length));
  const nameFontSize = longestLine >= 5 ? 12 : (longestLine === 4 ? 15 : 18);
  const iconInner = app.iconMode !== 'name' && app.icon
    ? `<img src="${esc(app.icon)}" alt="">`
    : `<div class="icon-name${app.accent.toUpperCase() === '#FFFFFF' ? '' : ' white-text'}" style="font-size:${nameFontSize}px;color:${app.accent.toUpperCase() === '#FFFFFF' ? '#293142' : 'rgba(255,255,255,.96)'}">${nameLines.map(line => `<span class="icon-name-line">${esc(line)}</span>`).join('')}</div>`;

  el.innerHTML = `
    <div class="icon" style="background:linear-gradient(160deg, ${esc(app.accent)}, ${esc(app.accent)}cc)">
      ${iconInner}
      <div class="badge"></div>
    </div>
    <div class="name">${esc(app.name)}</div>`;

  el.addEventListener('dblclick', () => post('open', { id: app.id }));
  el.addEventListener('click', (e) => { if (e.detail === 1) el._single = setTimeout(() => post('open', { id: app.id }), 190); });
  el.addEventListener('dblclick', () => clearTimeout(el._single));
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    clearTimeout(el._single);
    showMenu(e.clientX, e.clientY, app.id);
  });

  el.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', app.id);
    e.dataTransfer.effectAllowed = 'move';
    el.classList.add('dragging');
  });
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drop-target'); });
  el.addEventListener('dragleave', () => el.classList.remove('drop-target'));
  el.addEventListener('drop', (e) => {
    e.preventDefault();
    el.classList.remove('drop-target');
    const from = e.dataTransfer.getData('text/plain');
    const to = app.id;
    if (from && from !== to) post('move', { from, to });
  });

  return el;
}

// 单击打开（区分双击）
document.addEventListener('click', (e) => {
  if (!e.target.closest('.app')) hideMenu();
});

function showMenu(x, y, id) {
  menuTargetId = id;
  const app = state.apps.find(a => a.id === id);
  menu.querySelector('[data-act="reicon"]').style.display = app && app.iconMode === 'name' ? 'none' : '';
  menu.classList.add('show');
  const rect = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, window.innerWidth - rect.width - 12) + 'px';
  menu.style.top = Math.min(y, window.innerHeight - rect.height - 12) + 'px';
}
function hideMenu() { menu.classList.remove('show'); menuTargetId = null; }

menu.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || !menuTargetId) return;
  const act = btn.dataset.act;
  const id = menuTargetId;
  hideMenu();
  if (act === 'open') post('open', { id });
  else if (act === 'edit') openSheet(id);
  else if (act === 'reicon') post('reicon', { id });
  else if (act === 'clearlogin') post('clearlogin', { id });
  else if (act === 'delete') post('delete', { id });
});

// 空白处右键 → 添加
document.querySelector('.gridwrap').addEventListener('contextmenu', (e) => {
  if (e.target.closest('.app')) return;
  e.preventDefault();
  hideMenu();
  openSheet(null);
});

// ---------- 编辑弹窗 ----------
const fName = document.getElementById('fName');
const fURL = document.getElementById('fURL');
const fSupportedDomains = document.getElementById('fSupportedDomains');
const fIsolatedLogin = document.getElementById('fIsolatedLogin');
const fIconURL = document.getElementById('fIconURL');
const iconURLField = document.getElementById('iconURLField');
const swatches = document.getElementById('swatches');
const btnSave = document.getElementById('btnSave');
const btnCancel = document.getElementById('btnCancel');
const sheetTitle = document.getElementById('sheetTitle');
const iconModes = document.getElementById('iconModes');

function selectIconMode(mode) {
  chosenIconMode = mode;
  iconURLField.classList.toggle('visible', mode === 'website');
  iconModes.querySelectorAll('button').forEach(button => {
    button.classList.toggle('active', button.dataset.mode === mode);
  });
}
iconModes.addEventListener('click', e => {
  const button = e.target.closest('button[data-mode]');
  if (button) selectIconMode(button.dataset.mode);
});

function buildSwatches() {
  swatches.innerHTML = '';
  ACCENTS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'swatch' + (c === chosenAccent ? ' active' : '');
    d.style.background = `linear-gradient(160deg, ${c}, ${c}cc)`;
    d.addEventListener('click', () => { chosenAccent = c; buildSwatches(); });
    swatches.appendChild(d);
  });
}

function openSheet(id) {
  editingId = id;
  const app = id ? state.apps.find(a => a.id === id) : null;
  sheetTitle.textContent = app ? '编辑应用' : '添加应用';
  fName.value = app ? app.name : '';
  fURL.value = app ? app.url : '';
  fSupportedDomains.value = app ? (app.supportedDomains || '') : '';
  fIsolatedLogin.checked = app ? !!app.isolatedLogin : false;
  fIconURL.value = app ? (app.iconURL || '') : '';
  chosenAccent = app ? app.accent : ACCENTS[0];
  selectIconMode(app ? (app.iconMode || 'website') : 'website');
  buildSwatches();
  mask.classList.add('show');
  setTimeout(() => (app ? fName : fName).focus(), 60);
}

function closeSheet() { mask.classList.remove('show'); editingId = null; }

btnCancel.addEventListener('click', closeSheet);
mask.addEventListener('click', (e) => { if (e.target === mask) closeSheet(); });

btnSave.addEventListener('click', () => {
  const name = fName.value.trim();
  const url = fURL.value.trim();
  const iconURL = fIconURL.value.trim();
  if (!name || !url) {
    (name ? fURL : fName).focus();
    return;
  }
  btnSave.disabled = true;
  if (editingId) {
    post('update', { id: editingId, name, url, iconURL, accent: chosenAccent, iconMode: chosenIconMode, isolatedLogin: fIsolatedLogin.checked, supportedDomains: fSupportedDomains.value.trim() });
  } else {
    post('add', { name, url, iconURL, accent: chosenAccent, iconMode: chosenIconMode, isolatedLogin: fIsolatedLogin.checked, supportedDomains: fSupportedDomains.value.trim() });
  }
  setTimeout(() => { btnSave.disabled = false; }, 400);
  closeSheet();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSheet(); hideMenu(); }
  if (e.key === 'Enter' && mask.classList.contains('show')) btnSave.click();
});

// ---------- 来自原生 ----------
window.hubRender = function (json) {
  try {
    state = typeof json === 'string' ? JSON.parse(json) : json;
  } catch (_) { return; }
  render();
};
window.hubSetRunning = function (listJSON) {
  try { state.running = JSON.parse(listJSON); } catch (_) { state.running = []; }
  render();
};
window.hubToast = function (msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:rgba(30,36,48,.92);color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:99;border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 30px rgba(0,0,0,.45);';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
};
</script>
</body>
</html>
